services:
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports: ["8001:8000"]
    environment: &env
      DATABASE_URL: postgresql+psycopg://chronos:chronos@db:5432/chronos
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
  worker:
    build: .
    command: python -m app.worker
    environment: *env
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
  db:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: chronos, POSTGRES_PASSWORD: chronos, POSTGRES_DB: chronos}
    volumes: ["chronos-db:/var/lib/postgresql/data"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U chronos -d chronos"], interval: 3s, timeout: 3s, retries: 20}
  redis:
    image: redis:7-alpine
    volumes: ["chronos-redis:/data"]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 3s, timeout: 3s, retries: 20}
volumes:
  chronos-db:
  chronos-redis:
