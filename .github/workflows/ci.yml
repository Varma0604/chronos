name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres: {image: postgres:16, env: {POSTGRES_USER: chronos, POSTGRES_PASSWORD: chronos, POSTGRES_DB: chronos}, ports: ["5432:5432"], options: --health-cmd "pg_isready -U chronos" --health-interval 5s --health-timeout 5s --health-retries 5}
      redis: {image: redis:7, ports: ["6379:6379"], options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 5}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e '.[dev]'
      - run: pytest
